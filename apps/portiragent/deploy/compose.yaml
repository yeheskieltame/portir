# Portir agent + Caddy (HTTPS). Run from the repo root on the VPS:
#   docker compose -f apps/portiragent/deploy/compose.yaml up -d --build
services:
  agent:
    build:
      context: ../../..
      dockerfile: apps/portiragent/deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.studio/.env.local
    environment:
      # Production brain: the studio.toml [llm] model (Groq). Claude CLI is for local development only.
      PORTIR_BRAIN: studio
      # Public URL for the A2A agent card and the B402 resource URL. AgentCore sets this itself; on the VPS we must.
      AGENTCORE_RUNTIME_URL: https://agent.portir.xyz
      # The free chat face is paid by the operator's LLM credit: cap it for the whole process.
      SELLER_RATE_LIMIT_GLOBAL_MAX_REQUESTS: "20"
      SELLER_RATE_LIMIT_WINDOW_SECONDS: "60"
    volumes:
      - ../.studio:/app/apps/portiragent/.studio
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Mainnet executor: same image, same agent wallet (nonces are per chain), the mainnet PlanRegistry.
  # Not public: Caddy only routes agent.portir.xyz to the testnet agent above.
  # Arm only after one dry scan: PORTIR_EXECUTION=off first, then agentic-wallet + PORTIR_MAINNET_ARMED=yes in .env.mainnet.
  agent-mainnet:
    build:
      context: ../../..
      dockerfile: apps/portiragent/deploy/Dockerfile
    restart: unless-stopped
    env_file: [../.studio/.env.local, ../.studio/.env.mainnet]
    environment:
      PORTIR_BRAIN: studio
      AGENTCORE_RUNTIME_URL: https://agent.portir.xyz
      PORTIR_REGISTRY_CHAIN: mainnet
      PORTIR_REGISTRY: "0x28daDC35523CE792C7C09faf516763830C38f36b"
      PORTIR_REGISTRY_RPC: https://bsc-dataseed.bnbchain.org
      PORTIR_TELEGRAM_POLL: "off"
      PORTIR_LOANGUARD: "off"
    volumes:
      - ../.studio:/app/apps/portiragent/.studio
    expose: ["9000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [agent]

volumes:
  caddy_data:
