# Portir agent + Caddy (HTTPS). Run from the repo root on the VPS:
#   docker compose -f apps/portiragent/deploy/compose.yaml up -d --build
services:
  agent:
    build:
      context: ../../..
      dockerfile: apps/portiragent/deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.studio/.env.local
    environment:
      # Production brain: the studio.toml [llm] model (Groq). Claude CLI is for local development only.
      PORTIR_BRAIN: studio
      # Public URL for the A2A agent card and the B402 resource URL. AgentCore sets this itself; on the VPS we must.
      AGENTCORE_RUNTIME_URL: https://agent.portir.xyz
      # The free chat face is paid by the operator's LLM credit: cap it for the whole process.
      SELLER_RATE_LIMIT_GLOBAL_MAX_REQUESTS: "20"
      SELLER_RATE_LIMIT_WINDOW_SECONDS: "60"
    volumes:
      - ../.studio:/app/apps/portiragent/.studio
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [agent]

volumes:
  caddy_data:
